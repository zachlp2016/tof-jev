apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: tof-jev

resources:
  - ../namespace.yaml
  - ../configmap.yaml
  - ../deployment.yaml
  - ../service.yaml
  - ../networkpolicy.yaml
  - baremetal-laya-egress.yaml

images:
  - name: tof-prediction-adapter
    newName: ghcr.io/zachlp2016/tof-jev
    digest: sha256:375fdd02c665c2d2e32fa9d575fb73961d124f057f07dcf5c0d7a7000c38054a

replicas:
  - name: tof-prediction-adapter
    count: 1

patches:
  # Quotas are process-local: never overlap two adapter processes on this GPU.
  - target:
      kind: Deployment
      name: tof-prediction-adapter
    patch: |-
      - op: add
        path: /spec/strategy
        value: {type: Recreate}
      - op: replace
        path: /spec/template/spec/terminationGracePeriodSeconds
        value: 120
  # Infrastructure-only access; do not activate staged application namespaces.
  - target:
      kind: NetworkPolicy
      name: tof-prediction-adapter
    patch: |-
      - op: replace
        path: /spec/ingress/0/from
        value:
          - podSelector:
              matchLabels:
                tof-prediction-client: "true"
  - target:
      kind: Namespace
      name: tof
    patch: |-
      - op: replace
        path: /metadata/name
        value: tof-jev
  - target:
      kind: ConfigMap
      name: tof-prediction-adapter
    patch: |-
      - op: replace
        path: /data/TOF_LAYA_BASE_URL
        value: http://192.168.10.207:8084
      - op: add
        path: /data/TOF_LAYA_MODEL
        value: english
      - op: add
        path: /data/TOF_LAYA_MODEL_REVISION
        value: 55cf4c4ebb4ebe31b2550e8bdf3bd21b99753851
      - op: add
        path: /data/TOF_REQUEST_TIMEOUT_SECONDS
        value: "90"
      - op: add
        path: /data/TOF_CONSUMER_CONCURRENCY_LIMITS
        value: '{"router":4,"operations":1}'
      - op: replace
        path: /data/TOF_ALLOWED_HOSTS
        value: '["localhost","127.0.0.1","[::1]","tof-prediction-adapter","tof-prediction-adapter.tof-jev","tof-prediction-adapter.tof-jev.svc","tof-prediction-adapter.tof-jev.svc.cluster.local"]'
